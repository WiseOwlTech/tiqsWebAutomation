# Non-secret QA settings. Credentials come from environment variables / Jenkins credentials.
base.url=https://app.dev.tiqs.in/
# chrome = installed Google Chrome channel; chromium = bundled browser; webkit = Safari engine
browsers=chromium,chrome,firefox,webkit
headless=true
default.timeout.ms=30000
navigation.timeout.ms=45000
action.timeout.ms=15000
retry.count=1
parallel.threads=4
screenshot.on.failure=true
video.on.failure=true
trace.on.failure=true
# Placeholders until login details and testids are provided
login.strategy=pending
testid.prefix=
