# =============================================================================
# TIQS framework defaults. Locators and visible labels live here, not in page code.
# Format for locators: strategy=value
#   role.button | role.link | role.tab | role.heading | role.textbox
#   role.menuitem | role.dialog | role.status | role.alert
#   label | placeholder | text | css
# Optional test ids: <same.key>.testid=  (blank until the UI team publishes IDs)
# Env overlay: config/env.qa.properties (or uat/prod) then -D / ENV overrides.
# Temporary login testdata lives here until a secret store is added.
# =============================================================================

# --- runtime ---
base.url=https://app.dev.tiqs.in/
browsers=chromium,chrome,firefox,webkit
browser=chromium
headless=true
default.timeout.ms=30000
navigation.timeout.ms=45000
action.timeout.ms=15000
retry.count=1
parallel.threads=4
screenshot.on.failure=true
video.on.failure=true
trace.on.failure=true
allow.destructive.tests=true
testid.prefix=
login.strategy=pending
artifact.root=test-results
log.dir=logs

# --- testdata keys (non-secret defaults; override in env files) ---
testdata.watchlist.tab=1
testdata.symbol.sample=RELIANCE

